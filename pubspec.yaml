name: chiko
description: "Chiko — teman kuliah & kerja: tugas, jadwal, dan keuangan dalam satu aplikasi."
publish_to: 'none'

# versi (build-name) + build number. Naikkan build number di setiap rilis ke toko aplikasi.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  flutter_svg: ^2.0.17
  # Penyimpanan lokal (SQLite) — lihat lib/core/data/app_database.dart
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pembuat kode drift: `dart run build_runner build`
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  # Pembuat ikon aplikasi: `dart run flutter_launcher_icons`
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/chiko/

  # Font dibundel di aplikasi (tidak diunduh saat berjalan), lisensi SIL OFL 1.1.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFD12F"
  adaptive_icon_background: "#FFD12F"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFF8E7"
    theme_color: "#FFD12F"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
