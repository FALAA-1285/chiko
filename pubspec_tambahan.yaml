# Tambahkan ke pubspec.yaml project-mu.
# Paling mudah: jalankan `flutter pub add go_router google_fonts flutter_svg`
# supaya versi terbaru yang cocok dipilih otomatis.

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: any      # diganti otomatis oleh `flutter pub add`
  google_fonts: any
  flutter_svg: any

flutter:
  uses-material-design: true
  assets:
    - assets/chiko/
